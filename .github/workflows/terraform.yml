name: Terraform

# Plan on every PR against main (result posted as a PR comment), apply after merge to main.
# State lives in Terraform Cloud (see versions.tf); this workflow assumes the workspace uses
# *local* execution mode, so the Cloudflare credentials below are passed as env vars here.

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

# Never run two Terraform operations against the same state at once, and never cancel a
# run mid-apply.
concurrency:
  group: terraform-cloudflare-zero-trust
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_google_idp_client_secret: ${{ secrets.GOOGLE_IDP_CLIENT_SECRET }}
  # HCL list literal, e.g. ["203.0.113.10/32"] — terraform.tfvars is gitignored, so CI
  # gets it from a secret instead.
  TF_VAR_trusted_source_ips: ${{ secrets.TRUSTED_SOURCE_IPS }}

jobs:
  plan:
    name: Plan
    # PRs from forks get no secrets on a public repo, so a plan there could only fail.
    # Skip them instead.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15.0"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: terraform init
        run: terraform init

      - name: terraform validate
        id: validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -lock-timeout=5m
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          PLAN_ERR: ${{ steps.plan.outputs.stderr }}
        with:
          script: |
            const marker = '<!-- terraform-plan -->';
            const max = 60000;
            let plan = (process.env.PLAN || '') + (process.env.PLAN_ERR ? '\n' + process.env.PLAN_ERR : '');
            if (plan.length > max) plan = '... (truncated, see workflow log)\n' + plan.slice(-max);
            const body = [
              marker,
              '### Terraform plan',
              `fmt: \`${{ steps.fmt.outcome }}\` · validate: \`${{ steps.validate.outcome }}\` · plan: \`${{ steps.plan.outcome }}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan.trim(),
              '```',
              '</details>',
              '',
              `Commit ${context.sha.slice(0, 7)} · [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) · applies automatically after merge to \`main\`.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Fail if fmt or plan failed
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: |
          echo "fmt: ${{ steps.fmt.outcome }}, plan: ${{ steps.plan.outcome }}"
          exit 1

  apply:
    name: Apply
    # Manual dispatch is allowed only from main, so a feature branch can't be applied by accident.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15.0"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -auto-approve -no-color -lock-timeout=5m
